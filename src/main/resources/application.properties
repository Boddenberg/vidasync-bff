spring.application.name=vidasync-bff
server.port=${PORT:8080}
spring.config.import=optional:file:.env.properties,optional:file:vidasync-bff/.env.properties

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.HTTP=INFO
logging.level.vidasync.http=INFO
logging.level.com.vidasync_bff=INFO

ai.gateway.base-url=${AI_GATEWAY_BASE_URL:https://vidasync-multiagents-ia-production.up.railway.app}
ai.gateway.timeout-ms=${AI_GATEWAY_TIMEOUT_MS:120000}
ai.gateway.api-key=${AI_GATEWAY_API_KEY:}
internal.admin.api-key=${INTERNAL_ADMIN_API_KEY:}

supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:favorite-images}


